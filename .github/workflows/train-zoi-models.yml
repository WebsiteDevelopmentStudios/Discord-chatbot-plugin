name: Train Zoi model experiments

on:
  workflow_dispatch:
  push:
    paths:
      - "api/models/**"
      - ".github/workflows/train-zoi-models.yml"

permissions:
  contents: read

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: api/models/requirements.txt
      - name: Install training dependency
        run: python -m pip install -r api/models/requirements.txt
      - name: Train intent model
        run: python api/models/intent/ai.py train
      - name: Train knowledge-topic model
        run: python api/models/knowledge/ai.py train
      - name: Train tiny language model
        run: python api/models/language/ai.py train
      - name: Save trained model artifacts
        uses: actions/upload-artifact@v4
        with:
          name: zoi-trained-models
          path: |
            api/models/intent/artifacts/model.json
            api/models/knowledge/artifacts/model.json
            api/models/language/artifacts/model.json
          if-no-files-found: error
          retention-days: 30
